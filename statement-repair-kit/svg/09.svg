  <text class="cls-4" transform="translate(39.57 70.43)"><tspan x="0" y="0">Statement Repair Kit</tspan></text>
  <text class="cls-3" transform="translate(45.55 95.18)"><tspan x="0" y="0">Artist statements often begin with vague sentences. Use this tool to recognise common weak phrases, find a </tspan><tspan x="0" y="14.4">stronger writing move, and rewrite the sentence so it belongs to your own work.</tspan></text>
