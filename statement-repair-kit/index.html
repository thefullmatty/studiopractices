<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Statement Repair Kit</title>

  <!-- p5.js included for consistency with the Studio Practice interactive tools -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    :root {
  --bg: transparent;
  --text: #171717;
  --muted: #6f6f6f;
  --line: #171717;
  --card: rgba(255, 255, 255, 0.72);
  --soft: rgba(23, 23, 23, 0.12);
  --accent: #171717;
}

    * {
      box-sizing: border-box;
    }

    html,
body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.4;
}

    main {
  max-width: 980px;
  margin: 0 auto;
  padding: 24px;
}

    h1 {
      margin: 0 0 8px 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 800;
    }

    .intro {
      max-width: 760px;
      margin: 0 0 28px 0;
      font-size: 1rem;
      color: var(--text);
    }

    .section-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .section-tab {
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .section-tab:hover,
    .section-tab.active {
        background: #e6e6e6;
        color: var(--text);
}

    .section-info {
      margin-bottom: 20px;
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      padding: 18px 0;
    }

    .section-info h2 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
    }

    .section-info .subtitle {
      margin: 2px 0 10px 0;
      font-style: italic;
      color: var(--muted);
    }

    .section-info .prompt {
      margin: 0;
      max-width: 680px;
    }

    .repair-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      min-height: 190px;
    }

    .label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    select,
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    select {
      cursor: pointer;
    }

    .try-text {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.35;
    }

    .writer {
      margin-bottom: 18px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 30px;
    }

    button {
      font-family: inherit;
    }

    .action-button {
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--text);
  padding: 10px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.95rem;
}

.action-button.secondary {
  background: transparent;
  color: var(--text);
}

.action-button:hover {
  background: rgba(23, 23, 23, 0.08);
  color: var(--text);
  opacity: 1;
}


    .status {
      min-height: 22px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .draft {
  border-top: 1.5px solid var(--line);
  padding-top: 22px;
  margin-top: 16px;
}

#draftOutput {
  max-height: 280px;
  overflow-y: auto;
  padding-right: 10px;
}

    .draft h2 {
      margin: 0 0 14px 0;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
    }

    .draft-section {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 16px;
      border-top: 1px solid var(--soft);
      padding: 14px 0;
    }

    .draft-section:first-of-type {
      border-top: none;
    }

    .draft-heading {
      font-weight: 800;
    }

    .draft-text.empty {
      color: var(--muted);
      font-style: italic;
    }

    @media (max-width: 740px) {
      body {
        padding: 18px;
      }

      .repair-grid {
        grid-template-columns: 1fr;
      }

      .draft-section {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <main id="statement-repair-kit">
    <h1>Statement Repair Kit</h1>

    <p class="intro">
      Artist statements often begin with vague sentences. Use this tool to recognise common weak phrases, find a stronger writing move, and rewrite the sentence so it belongs to your own work.
    </p>

    <div class="section-tabs" id="sectionTabs"></div>

    <section class="section-info">
      <h2 id="sectionTitle">Encounter</h2>
      <p class="subtitle" id="sectionSubtitle">what is here?</p>
      <p class="prompt" id="sectionPrompt">What is the viewer meeting?</p>
    </section>

    <section class="repair-grid">
      <div class="card">
        <label class="label" for="avoidSelect">Avoid</label>
        <select id="avoidSelect"></select>
      </div>

      <div class="card">
        <span class="label">Try instead</span>
        <p class="try-text" id="tryText"></p>
      </div>
    </section>

    <section class="writer">
      <label class="label" for="studentSentence">Your version</label>
      <textarea id="studentSentence" placeholder="Rewrite the sentence so it belongs to your work..."></textarea>
    </section>

    <section class="actions">
      <button class="action-button" id="addButton">Add to my draft</button>
      <button class="action-button secondary" id="copyButton">Copy draft text</button>
      <button class="action-button secondary" id="downloadButton">Download .txt</button>
      <button class="action-button secondary" id="clearSectionButton">Clear current section</button>
      <button class="action-button secondary" id="clearAllButton">Clear all</button>
    </section>

    <div class="status" id="statusMessage"></div>

    <section class="draft">
      <h2>My draft statement</h2>
      <div id="draftOutput"></div>
    </section>
  </main>

  <script src="js/statement-repair-kit.js"></script>
</body>
</html>
