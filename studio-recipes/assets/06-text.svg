  <text class="cls-4" transform="translate(67.11 206.79)"><tspan class="cls-12" x="0" y="0">A</tspan><tspan x="7.34" y="0" xml:space="preserve"> recipe o</tspan><tspan class="cls-11" x="53.37" y="0">f</tspan><tspan x="56.48" y="0">fers ingredients, steps, and conditions, but the making is yours.</tspan><tspan x="0" y="28.8">Use this tool to compose a studio recipe from your site of inquir</tspan><tspan class="cls-8" x="334.82" y="28.8">y</tspan><tspan x="339.93" y="28.8">. Select or write an action, </tspan><tspan x="0" y="43.2">choose how you will document it, and add a journal prompt to help you reflect on what </tspan><tspan x="0" y="57.6">happens.</tspan><tspan x="0" y="86.4">The recipe builder will help you turn these parts into an editable studio recipe.</tspan><tspan class="cls-11" x="410.91" y="86.4"> </tspan><tspan class="cls-9" x="414.02" y="86.4">Y</tspan><tspan x="420.93" y="86.4">ou can </tspan><tspan x="0" y="100.8">revise it, make it more specific to your project, then copy or print it as a prompt for your </tspan><tspan x="0" y="115.2">next studio session.</tspan><tspan class="cls-9" x="0" y="144">Y</tspan><tspan x="6.9" y="144">ou can follow the recipe closel</tspan><tspan class="cls-8" x="166.99" y="144">y</tspan><tspan x="172.1" y="144">, adapt it, or use it as a starting point for something </tspan><tspan x="0" y="158.4">unexpected.</tspan><tspan x="0" y="187.2">Some recipes work. Some fail. Both can teach you something.</tspan><tspan class="cls-12" x="0" y="216">A</tspan><tspan x="7.34" y="216" xml:space="preserve"> recipe is not a rule. It is a way to begin.</tspan></text>
</svg>