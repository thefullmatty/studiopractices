<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search the Field</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="tool-wrap" aria-label="Search the Field">
    <section class="stage">
      <div class="stage-inner">
      <h1 class="tool-title">Search the Field</h1>
      <img class="layer base" src="assets/01-base.svg" alt="" aria-hidden="true" />
      <svg id="lines" class="lines" viewBox="0 0 960.87 890" aria-hidden="true"></svg>
      <div id="network" class="network" aria-label="Concept word web"></div>
      <label class="visually-hidden" for="searchTerm">Search term</label>
      <input id="searchTerm" class="search-input" type="text" placeholder="type a search term or select from above" autocomplete="off" />
      <button id="searchBtn" class="search-button" type="button" aria-label="Search selected resource">Search</button>

      <button class="category-button collections" data-category="collections" type="button" aria-label="Search collections">Search collections</button>
      <button class="category-button channels" data-category="channels" type="button" aria-label="Search channels">Search channels</button>
      <button class="category-button writing" data-category="writing" type="button" aria-label="Search writing">Search writing</button>
      <button id="resetBtn" class="reset-button" type="button" aria-label="Reset">Reset</button>

      <div id="resourceMenu" class="resource-menu" aria-live="polite"></div>
      <div id="statusText" class="status-text" aria-live="polite">Type a term or choose one from the word web.</div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
